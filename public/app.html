<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MyCommunity</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font:14px/1.5 system-ui,sans-serif;background:#1a1a2e;color:#eee;display:flex}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:200px;background:#0f3460;display:flex;flex-direction:column;z-index:50}
#logo{padding:20px 16px;font-size:1.2rem;font-weight:700;color:#e94560;border-bottom:1px solid #1a1a40}
#nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-item{padding:12px 20px;cursor:pointer;display:flex;align-items:center;gap:10px;color:#aaa;transition:.2s;border-left:3px solid transparent}
.nav-item:hover{background:#1a1a40;color:#eee}
.nav-item.active{background:#1a1a40;color:#e94560;border-left-color:#e94560}
.nav-item .badge{background:#e94560;color:#fff;font-size:.7rem;padding:1px 7px;border-radius:10px;margin-left:auto}
.nav-item.hidden{display:none}
#main{margin-left:200px;flex:1;min-height:100vh;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:flex-end;padding:12px 32px;background:#16213ee0;backdrop-filter:blur(8px);border-bottom:1px solid #1a1a40;gap:12px}
#user-info{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#user-info .uid{color:#555;font-size:.78rem}
.role-badge{font-size:.7rem;padding:1px 8px;border-radius:10px;font-weight:600}
.role-user{background:#333;color:#aaa}
.role-vip{background:#b8860b;color:#fff}
.role-svip{background:#e94560;color:#fff}
.role-admin{background:#4a0080;color:#fff}
.xp-text{color:#888;font-size:.78rem}
.btn{padding:6px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.85rem;transition:.2s;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:#e94560;color:#fff}
.btn-primary:hover{background:#c73650}
.btn-ghost{background:transparent;color:#e94560;border:1px solid #e94560}
.btn-ghost:hover{background:#e94560;color:#fff}
.btn-sm{font-size:.8rem;padding:4px 10px}
.btn-danger{background:#c0392b;color:#fff}
.btn-danger:hover{background:#a93226}
section{padding:48px 48px 80px;min-height:100vh}
section:nth-child(even){background:#15152a}
.section-title{font-size:1.6rem;color:#e94560;margin-bottom:8px}
.section-sub{color:#666;margin-bottom:32px;font-size:.95rem}
#sec-home{display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:100vh}
#sec-home h1{font-size:2.8rem;color:#e94560;margin-bottom:12px}
#sec-home p{color:#888;max-width:520px;margin:0 auto 32px;font-size:1.05rem}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;max-width:640px;margin:0 auto}
.feature-card{background:#0f3460;border-radius:12px;padding:24px 16px;text-align:center;transition:.3s}
.feature-card:hover{transform:translateY(-4px);background:#1a1a50}
.feature-card .icon{font-size:2.2rem;margin-bottom:8px}
.feature-card h3{font-size:1rem;margin-bottom:4px}
.feature-card p{color:#888;font-size:.82rem}
#home-user-info{color:#888;margin-bottom:24px}
#sec-friends .friends-layout{display:flex;gap:24px;height:520px}
.friends-sidebar{width:300px;flex-shrink:0;background:#16213e;border-radius:12px;padding:16px;display:flex;flex-direction:column}
.friends-sidebar .tabs{display:flex;gap:4px;margin-bottom:12px;background:#0f3460;border-radius:8px;padding:3px}
.friends-sidebar .tabs .tab{flex:1;text-align:center;padding:7px;border-radius:6px;cursor:pointer;font-size:.82rem;color:#888;transition:.2s}
.friends-sidebar .tabs .tab.active{background:#e94560;color:#fff}
.friends-sidebar .tabs .tab:hover:not(.active){color:#eee}
.friends-sidebar .tab-content{flex:1;overflow-y:auto}
.tab-content .no-data{text-align:center;color:#555;padding:40px 0;font-size:.85rem}
.friend-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:6px;transition:.2s;margin-bottom:2px}
.friend-item:hover{background:#0f3460}
.friend-item .name{font-size:.9rem}
.friend-item .uid-text{color:#555;font-size:.75rem;margin-left:6px}
.search-area input{width:100%;padding:8px 12px;border:none;border-radius:6px;background:#0f3460;color:#eee;font-size:.85rem;outline:none;margin-bottom:8px}
.search-area input::placeholder{color:#555}
.search-result{padding:8px 10px;background:#0f3460;border-radius:6px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
#sec-chat .chat-layout{display:flex;gap:24px;height:520px}
.chat-friends{width:220px;flex-shrink:0;background:#16213e;border-radius:12px;padding:12px;overflow-y:auto}
.chat-friends .cf-item{padding:10px 12px;border-radius:6px;cursor:pointer;transition:.2s;margin-bottom:2px}
.chat-friends .cf-item:hover{background:#0f3460}
.chat-friends .cf-item.active{background:#0f3460;border-left:3px solid #e94560}
.chat-friends .cf-item .cf-name{font-size:.9rem}
.chat-friends .cf-item .cf-uid{color:#555;font-size:.75rem}
.chat-area{flex:1;background:#16213e;border-radius:12px;display:flex;flex-direction:column;min-width:0}
.chat-header{padding:14px 20px;border-bottom:1px solid #1a1a40;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.chat-input-area{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #1a1a40}
.chat-input-area input{flex:1;padding:10px 14px;border:none;border-radius:8px;background:#0f3460;color:#eee;font-size:.9rem;outline:none}
.chat-input-area input::placeholder{color:#555}
.msg-bubble{max-width:70%;padding:8px 14px;border-radius:12px;font-size:.9rem;word-break:break-word;animation:fadeIn .15s}
.msg-bubble.sent{background:#e94560;align-self:flex-end;border-bottom-right-radius:4px}
.msg-bubble.received{background:#0f3460;align-self:flex-start;border-bottom-left-radius:4px}
.msg-bubble .msg-time{font-size:.65rem;color:rgba(255,255,255,.5);margin-top:3px;text-align:right}
.msg-bubble.received .msg-time{color:#666}
.msg-bubble .xp-tag{font-size:.65rem;color:#f1c40f;margin-left:6px}
.chat-placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:#555;font-size:.9rem}
/* Minesweeper */
.mine-cell{width:36px;height:36px;border:none;border-radius:4px;font-size:.85rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.1s;background:#0f3460;color:#eee}
.mine-cell:hover{background:#1a1a50}
.mine-cell.revealed{background:#16213e;cursor:default}
.mine-cell.revealed:hover{background:#16213e}
.mine-cell.flag{background:#3d2a1a;color:#e94560}
.mine-cell.mine{background:#c0392b;color:#fff}
.mine-cell.n0{color:#555}
.mine-cell.n1{color:#4fc3f7}
.mine-cell.n2{color:#81c784}
.mine-cell.n3{color:#e94560}
.mine-cell.n4{color:#9c27b0}
.mine-cell.n5{color:#ff7043}
/* Admin */
#sec-admin .admin-table-wrap{overflow-x:auto;background:#16213e;border-radius:12px;padding:16px}
#sec-admin table{width:100%;border-collapse:collapse;font-size:.85rem}
#sec-admin th,#sec-admin td{padding:10px 12px;text-align:left;border-bottom:1px solid #1a1a40}
#sec-admin th{color:#888;font-weight:600;font-size:.8rem}
#sec-admin tr:hover td{background:#0f3460}
#sec-admin select{padding:4px 6px;border:none;border-radius:4px;background:#0f3460;color:#eee;font-size:.8rem;outline:none;cursor:pointer}
#sec-admin .xp-input{width:70px;padding:4px 6px;border:none;border-radius:4px;background:#0f3460;color:#eee;font-size:.8rem;text-align:center;outline:none}
#sec-admin .xp-input:focus{border:1px solid #e94560}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:200}
.modal-overlay.show{display:flex}
.modal{background:#16213e;border-radius:12px;padding:28px;width:360px;max-width:92vw}
.modal h2{text-align:center;margin-bottom:20px;color:#e94560}
.modal .form-group{margin-bottom:14px}
.modal label{display:block;color:#aaa;margin-bottom:4px;font-size:.85rem}
.modal input{width:100%;padding:9px 12px;border:none;border-radius:6px;background:#0f3460;color:#eee;font-size:.9rem;outline:none}
.modal input::placeholder{color:#555}
.modal button{width:100%;padding:9px;margin-top:4px}
.modal .switch-link{text-align:center;margin-top:12px;color:#888;font-size:.85rem;cursor:pointer}
.modal .switch-link:hover{color:#e94560}
.modal .modal-error{background:#3d1a1a;color:#ff6b6b;padding:6px 10px;border-radius:6px;margin-bottom:12px;font-size:.8rem;display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div id="sidebar">
  <div id="logo">MyCommunity</div>
  <div id="nav">
    <div class="nav-item active" data-target="home">🏠 首页</div>
    <div class="nav-item" data-target="friends">👥 好友</div>
    <div class="nav-item" data-target="chat">💬 消息</div>
    <div class="nav-item" data-target="games">🎮 游戏</div>
    <div class="nav-item hidden" data-target="admin" id="nav-admin">🔧 管理</div>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <div id="user-info"></div>
  </div>

  <section id="sec-home">
    <div id="home-guest">
      <h1>欢迎来到 MyCommunity</h1>
      <p>结交好友，实时聊天，升级成长。</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="showModal('login')">登录</button>
        <button class="btn btn-ghost" onclick="showModal('register')">注册</button>
        <button class="btn btn-ghost" onclick="guestLogin()">游客体验</button>
      </div>
    </div>
    <div id="home-user" style="display:none">
      <h1>欢迎回来</h1>
      <p id="home-user-info"></p>
      <div class="features">
        <div class="feature-card"><div class="icon">👥</div><h3>好友</h3><p>搜索添加好友</p></div>
        <div class="feature-card"><div class="icon">💬</div><h3>消息</h3><p>实时私聊</p></div>
        <div class="feature-card"><div class="icon">🎮</div><h3>游戏</h3><p>休闲小游戏</p></div>
      </div>
    </div>
  </section>

  <section id="sec-friends">
    <h2 class="section-title">👥 好友</h2>
    <p class="section-sub">管理你的好友关系</p>
    <div class="friends-layout">
      <div class="friends-sidebar">
        <div class="tabs">
          <div class="tab active" data-ftab="list">我的好友</div>
          <div class="tab" data-ftab="requests" id="tab-requests">请求 <span id="req-badge" style="display:none;background:#e94560;color:#fff;border-radius:10px;padding:0 6px;font-size:.7rem;margin-left:2px">0</span></div>
          <div class="tab" data-ftab="search">添加</div>
        </div>
        <div class="tab-content" id="ftab-list"><div class="no-data">暂无好友</div></div>
        <div class="tab-content" id="ftab-requests" style="display:none"><div class="no-data">暂无请求</div></div>
        <div class="tab-content" id="ftab-search" style="display:none">
          <div class="search-area">
            <input id="search-input" placeholder="搜索用户名或UID..." oninput="searchUsers(this.value)">
            <div id="search-results"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="sec-chat">
    <h2 class="section-title">💬 消息</h2>
    <p class="section-sub">与好友实时私聊</p>
    <div class="chat-layout">
      <div class="chat-friends" id="chat-friends-list"><div class="no-data" style="padding:20px">暂无好友</div></div>
      <div class="chat-area" id="chat-area">
        <div class="chat-header" id="chat-header">选择一个好友开始聊天</div>
        <div class="chat-placeholder" id="chat-placeholder">👈 从左侧选择一个好友</div>
        <div class="chat-messages" id="chat-messages" style="display:none"></div>
        <div class="chat-input-area" id="chat-input-area" style="display:none">
          <input id="chat-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMessage()">
          <button class="btn btn-primary btn-sm" onclick="sendMessage()">发送</button>
        </div>
      </div>
    </div>
  </section>

  <section id="sec-games">
    <h2 class="section-title">🎮 游戏</h2>
    <p class="section-sub">经典扫雷，点击格子揭开，右键标记地雷</p>
    <div style="display:flex;flex-direction:column;align-items:center">
      <div id="mine-status" style="display:flex;gap:24px;margin-bottom:12px;font-size:.9rem;color:#888">
        <span>💣 <span id="mine-count">10</span></span>
        <span>⏱️ <span id="mine-timer">000</span></span>
      </div>
      <div id="mine-grid" style="display:inline-grid;grid-template-columns:repeat(9,36px);gap:2px"></div>
      <button class="btn btn-ghost" style="margin-top:16px" onclick="initMinesweeper()">🔄 重新开始</button>
      <div id="mine-message" style="margin-top:10px;font-size:.95rem;min-height:1.5em;color:#888"></div>
    </div>
  </section>

  <section id="sec-admin">
    <h2 class="section-title">🔧 管理面板</h2>
    <p class="section-sub">用户管理</p>
    <div class="admin-table-wrap">
      <table>
        <thead><tr><th>ID</th><th>UID</th><th>用户名</th><th>角色</th><th>等级</th><th>经验</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="admin-user-list"></tbody>
      </table>
    </div>
  </section>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">登录</h2>
    <div class="modal-error" id="modal-error"></div>
    <div id="modal-body"></div>
    <div class="switch-link" id="modal-switch"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let currentUser = null, socket = null, selectedChatFriend = null, allFriends = [];

// Navigation
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    const t = document.getElementById('sec-' + el.dataset.target);
    if (t) t.scrollIntoView({behavior:'smooth'});
  });
});
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      const nav = document.querySelector(`.nav-item[data-target="${e.target.id.replace('sec-','')}"]`);
      if (nav) nav.classList.add('active');
    }
  });
}, {threshold:0.3});
document.querySelectorAll('section').forEach(s => observer.observe(s));

async function init() {
  const r = await fetch('/api/me');
  const d = await r.json();
  if (d.user) {
    currentUser = d.user;
    renderUserInfo();
    if (currentUser.role === 'admin') document.getElementById('nav-admin').classList.remove('hidden');
    connectSocket();
  }
  renderHome();
  loadFriends();
}
init();

function roleHtml(role) {
  const labels = {user:'用户',vip:'VIP',svip:'SVIP',admin:'超管'};
  return `<span class="role-badge role-${role}">${labels[role]||role}</span>`;
}

function renderUserInfo() {
  const el = document.getElementById('user-info');
  if (!currentUser) {
    el.innerHTML = `<button class="btn btn-primary btn-sm" onclick="showModal('login')">登录</button><button class="btn btn-ghost btn-sm" onclick="showModal('register')">注册</button><button class="btn btn-ghost btn-sm" onclick="guestLogin()">游客</button>`;
    return;
  }
  const lv = currentUser.level || 1;
  el.innerHTML = `${roleHtml(currentUser.role)} <span>${escapeHtml(currentUser.username)}</span><span class="uid">${currentUser.uid}</span><span class="xp-text">Lv.${lv} (${currentUser.xp||0}XP)</span><button class="btn btn-ghost btn-sm" onclick="logout()">退出</button>`;
}

function renderHome() {
  document.getElementById('home-guest').style.display = currentUser ? 'none' : '';
  const hu = document.getElementById('home-user');
  if (currentUser) {
    hu.style.display = '';
    const lv = currentUser.level || 1;
    document.getElementById('home-user-info').innerHTML = `UID: ${currentUser.uid} | ${roleHtml(currentUser.role)} | 等级 Lv.${lv} | 经验 ${currentUser.xp||0}`;
  } else hu.style.display = 'none';
}

function showModal(type) {
  document.getElementById('modal-error').style.display = 'none';
  document.getElementById('modal-overlay').classList.add('show');
  if (type === 'login') {
    document.getElementById('modal-title').textContent = '登录';
    document.getElementById('modal-body').innerHTML = `<div class="form-group"><label>用户名</label><input id="m-user" placeholder="输入用户名"></div><div class="form-group"><label>密码</label><input id="m-pass" type="password" placeholder="输入密码"></div><button class="btn btn-primary" onclick="doLogin()">登录</button>`;
    document.getElementById('modal-switch').innerHTML = '没有账号？<span style="color:#e94560" onclick="showModal(\'register\')">去注册</span>';
  } else {
    document.getElementById('modal-title').textContent = '注册';
    document.getElementById('modal-body').innerHTML = `<div class="form-group"><label>用户名</label><input id="m-user" placeholder="输入用户名"></div><div class="form-group"><label>密码</label><input id="m-pass" type="password" placeholder="至少 4 位"></div><button class="btn btn-primary" onclick="doRegister()">注册</button>`;
    document.getElementById('modal-switch').innerHTML = '已有账号？<span style="color:#e94560" onclick="showModal(\'login\')">去登录</span>';
  }
  setTimeout(() => document.getElementById('m-user')?.focus(), 100);
}
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) document.getElementById('modal-overlay').classList.remove('show');
});

async function doLogin() {
  const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('m-user').value,password:document.getElementById('m-pass').value})});
  const d = await r.json();
  if (d.error) return showModalError(d.error);
  afterAuth(d);
}
async function doRegister() {
  const r = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('m-user').value,password:document.getElementById('m-pass').value})});
  const d = await r.json();
  if (d.error) return showModalError(d.error);
  afterAuth(d);
}
async function guestLogin() {
  const r = await fetch('/api/guest-login',{method:'POST'});
  const d = await r.json();
  afterAuth(d);
}
function afterAuth(d) {
  document.getElementById('modal-overlay').classList.remove('show');
  currentUser = d;
  if (currentUser.role === 'admin') document.getElementById('nav-admin').classList.remove('hidden');
  renderUserInfo(); renderHome(); connectSocket(); loadFriends();
}
async function logout() {
  await fetch('/api/logout',{method:'POST'});
  currentUser = null; if (socket) { socket.close(); socket = null; }
  selectedChatFriend = null; allFriends = [];
  document.getElementById('nav-admin').classList.add('hidden');
  renderUserInfo(); renderHome();
  document.getElementById('sec-home').scrollIntoView({behavior:'smooth'});
}
function showModalError(msg) {
  const el = document.getElementById('modal-error');
  el.textContent = msg; el.style.display = 'block';
}

function connectSocket() {
  if (socket) socket.close();
  socket = io();
  socket.on('private message', msg => {
    if (msg.senderId === currentUser.id) {
      if (selectedChatFriend && selectedChatFriend.id === msg.receiverId) appendMessage(msg, true);
    } else if (selectedChatFriend && selectedChatFriend.id === msg.senderId) appendMessage(msg, false);
  });
  socket.on('friend request', () => loadFriends());
  socket.on('friend added', () => { loadFriends(); loadChatFriends(); });
  socket.on('banned', () => { alert('你已被封禁'); logout(); });
}

async function loadFriends() {
  if (!currentUser) return;
  const rr = await fetch('/api/friends/requests');
  const rd = await rr.json();
  const badge = document.getElementById('req-badge');
  if (rd.requests && rd.requests.length > 0) { badge.textContent = rd.requests.length; badge.style.display = 'inline'; }
  else badge.style.display = 'none';
  const r = await fetch('/api/friends');
  const d = await r.json();
  allFriends = d.friends || [];
  const el = document.getElementById('ftab-list');
  if (!allFriends.length) { el.innerHTML = '<div class="no-data">暂无好友</div>'; return; }
  el.innerHTML = allFriends.map(f => `<div class="friend-item"><div><span class="name">${escapeHtml(f.username)}</span><span class="uid-text">${f.uid}</span></div></div>`).join('');
  renderFriendRequests();
}
function renderFriendRequests() {
  fetch('/api/friends/requests').then(r=>r.json()).then(data => {
    const el = document.getElementById('ftab-requests');
    if (!data.requests || !data.requests.length) { el.innerHTML = '<div class="no-data">暂无好友请求</div>'; return; }
    el.innerHTML = data.requests.map(f => `<div class="friend-item"><div><span class="name">${escapeHtml(f.username)}</span><span class="uid-text">${f.uid}</span></div><div style="display:flex;gap:4px"><button class="btn btn-primary btn-sm" onclick="acceptReq(${f.id})">接受</button><button class="btn btn-ghost btn-sm" onclick="declineReq(${f.id})">拒绝</button></div></div>`).join('');
  });
}
async function acceptReq(fid) { await fetch('/api/friends/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({friendId:fid})}); loadFriends(); loadChatFriends(); }
async function declineReq(fid) { await fetch('/api/friends/decline',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({friendId:fid})}); loadFriends(); }
async function searchUsers(q) {
  const el = document.getElementById('search-results');
  if (!q||q.length<1) { el.innerHTML=''; return; }
  const r = await fetch('/api/users/search?q='+encodeURIComponent(q));
  const d = await r.json();
  if (!d.users||!d.users.length) { el.innerHTML='<div class="no-data" style="padding:10px">未找到用户</div>'; return; }
  el.innerHTML = d.users.map(u => {
    const isFriend = allFriends.some(f=>f.id===u.id), isSelf = u.id===currentUser.id;
    const btn = isSelf ? '' : (isFriend ? '<button class="btn btn-sm" style="background:#333;color:#888;cursor:default" disabled>已是好友</button>' : `<button class="btn btn-primary btn-sm" onclick="addFriend(${u.id})">添加</button>`);
    return `<div class="search-result"><div><span>${escapeHtml(u.username)}</span><span class="uid-text">${u.uid}</span></div>${btn}</div>`;
  }).join('');
}
async function addFriend(fid) {
  const r = await fetch('/api/friends/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({friendId:fid})});
  const d = await r.json();
  if (d.error) return alert(d.error);
  if (d.status==='accepted') { alert('对方已添加你为好友！'); loadFriends(); loadChatFriends(); }
  else alert('好友请求已发送');
}
document.querySelectorAll('.friends-sidebar .tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.friends-sidebar .tabs .tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.friends-sidebar .tab-content').forEach(c=>c.style.display='none');
    document.getElementById('ftab-'+tab.dataset.ftab).style.display='';
    if (tab.dataset.ftab==='requests') renderFriendRequests();
  });
});

async function loadChatFriends() {
  if (!currentUser) return;
  const r = await fetch('/api/friends'), d = await r.json(), friends = d.friends||[];
  const el = document.getElementById('chat-friends-list');
  if (!friends.length) { el.innerHTML='<div class="no-data" style="padding:20px">暂无好友</div>'; return; }
  el.innerHTML = friends.map(f => `<div class="cf-item ${selectedChatFriend&&selectedChatFriend.id===f.id?'active':''}" onclick="selectChatFriend(${f.id},'${escapeHtml(f.username)}','${f.uid}')"><div class="cf-name">${escapeHtml(f.username)}</div><div class="cf-uid">${f.uid}</div></div>`).join('');
}
async function selectChatFriend(fid,un,uid) {
  selectedChatFriend = {id:fid,username:un,uid};
  document.querySelectorAll('.cf-item').forEach(e=>e.classList.remove('active'));
  if (event) event.currentTarget.classList.add('active');
  document.getElementById('chat-header').textContent = `${un} (${uid})`;
  document.getElementById('chat-placeholder').style.display = 'none';
  document.getElementById('chat-messages').style.display = 'flex';
  document.getElementById('chat-input-area').style.display = 'flex';
  document.getElementById('chat-messages').innerHTML = '<div style="text-align:center;color:#555;padding:10px">加载中...</div>';
  document.getElementById('chat-input').focus();
  const r = await fetch(`/api/messages/${fid}`), d = await r.json();
  document.getElementById('chat-messages').innerHTML = '';
  (d.messages||[]).forEach(m => appendMessage(m, m.senderId === currentUser.id));
  scrollChat();
}
function appendMessage(msg, sent) {
  const el = document.getElementById('chat-messages'), div = document.createElement('div');
  div.className = 'msg-bubble ' + (sent?'sent':'received');
  let html = `${escapeHtml(msg.content)}<div class="msg-time">${new Date(msg.createdAt).toLocaleTimeString()}`;
  if (msg.xpGained) html += ` <span class="xp-tag">+${msg.xpGained}XP</span>`;
  html += '</div>';
  div.innerHTML = html;
  el.appendChild(div); scrollChat();
}
function scrollChat() { setTimeout(()=>document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight, 50); }
async function sendMessage() {
  const input = document.getElementById('chat-input'), text = input.value.trim();
  if (!text||!selectedChatFriend) return;
  input.value = '';
  socket.emit('private message', {receiverId:selectedChatFriend.id, content:text});
}

// Minesweeper
const MS_ROWS = 9, MS_COLS = 9, MS_MINES = 10;
let msBoard = [], msRevealed = [], msFlagged = [], msGameOver = false, msFirst = true, msTimer = null, msSeconds = 0;

function initMinesweeper() {
  if (msTimer) { clearInterval(msTimer); msTimer = null; }
  msBoard = Array.from({length: MS_ROWS}, () => Array(MS_COLS).fill(0));
  msRevealed = Array.from({length: MS_ROWS}, () => Array(MS_COLS).fill(false));
  msFlagged = Array.from({length: MS_ROWS}, () => Array(MS_COLS).fill(false));
  msGameOver = false; msFirst = true; msSeconds = 0;
  document.getElementById('mine-count').textContent = MS_MINES;
  document.getElementById('mine-timer').textContent = '000';
  document.getElementById('mine-message').textContent = '';
  renderMineGrid();
}

function placeMines(excludeR, excludeC) {
  let placed = 0;
  while (placed < MS_MINES) {
    const r = Math.floor(Math.random() * MS_ROWS);
    const c = Math.floor(Math.random() * MS_COLS);
    if (msBoard[r][c] !== -1 && !(r === excludeR && c === excludeC)) {
      msBoard[r][c] = -1; placed++;
    }
  }
  for (let r = 0; r < MS_ROWS; r++)
    for (let c = 0; c < MS_COLS; c++)
      if (msBoard[r][c] !== -1)
        msBoard[r][c] = [[-1,0],[0,-1],[0,1],[1,0],[-1,-1],[-1,1],[1,-1],[1,1]]
          .reduce((n, d) => n + (msBoard[r+d[0]]?.[c+d[1]] === -1 ? 1 : 0), 0);
}

function renderMineGrid() {
  const grid = document.getElementById('mine-grid');
  grid.innerHTML = '';
  for (let r = 0; r < MS_ROWS; r++) {
    for (let c = 0; c < MS_COLS; c++) {
      const cell = document.createElement('button');
      cell.className = 'mine-cell';
      cell.dataset.r = r; cell.dataset.c = c;
      cell.addEventListener('click', () => msReveal(r, c));
      cell.addEventListener('contextmenu', e => { e.preventDefault(); msFlag(r, c); });
      grid.appendChild(cell);
    }
  }
}

function updateCell(r, c) {
  const cells = document.getElementById('mine-grid').children;
  const idx = r * MS_COLS + c;
  const cell = cells[idx];
  if (msRevealed[r][c]) {
    cell.className = 'mine-cell revealed';
    if (msBoard[r][c] === -1) { cell.textContent = '💣'; cell.classList.add('mine'); }
    else { cell.textContent = msBoard[r][c] || ''; cell.classList.add('n' + msBoard[r][c]); }
  } else if (msFlagged[r][c]) {
    cell.className = 'mine-cell flag'; cell.textContent = '🚩';
  } else {
    cell.className = 'mine-cell'; cell.textContent = '';
  }
}

function msReveal(r, c) {
  if (msGameOver || msRevealed[r][c] || msFlagged[r][c]) return;
  if (msFirst) { placeMines(r, c); msFirst = false; msTimer = setInterval(() => {
    msSeconds++; document.getElementById('mine-timer').textContent = String(msSeconds).padStart(3, '0');
  }, 1000); }
  if (msBoard[r][c] === -1) {
    msGameOver = true; clearInterval(msTimer);
    for (let rr = 0; rr < MS_ROWS; rr++)
      for (let cc = 0; cc < MS_COLS; cc++)
        if (msBoard[rr][cc] === -1) { msRevealed[rr][cc] = true; updateCell(rr, cc); }
    document.getElementById('mine-message').textContent = '💥 踩到地雷了！';
    return;
  }
  reveal(r, c);
  checkWin();
}

function reveal(r, c) {
  if (r < 0 || r >= MS_ROWS || c < 0 || c >= MS_COLS || msRevealed[r][c] || msFlagged[r][c]) return;
  msRevealed[r][c] = true; updateCell(r, c);
  if (msBoard[r][c] === 0)
    [[-1,0],[0,-1],[0,1],[1,0],[-1,-1],[-1,1],[1,-1],[1,1]].forEach(d => reveal(r+d[0], c+d[1]));
}

function msFlag(r, c) {
  if (msGameOver || msRevealed[r][c]) return;
  msFlagged[r][c] = !msFlagged[r][c]; updateCell(r, c);
  const remaining = MS_MINES - Object.values(msFlagged).flat().filter(Boolean).length;
  document.getElementById('mine-count').textContent = remaining;
}

function checkWin() {
  const totalCells = MS_ROWS * MS_COLS;
  const revealed = msRevealed.flat().filter(Boolean).length;
  if (revealed === totalCells - MS_MINES) {
    msGameOver = true; clearInterval(msTimer);
    document.getElementById('mine-message').textContent = '🎉 你赢了！';
    for (let r = 0; r < MS_ROWS; r++)
      for (let c = 0; c < MS_COLS; c++)
        if (msBoard[r][c] === -1) { msFlagged[r][c] = true; updateCell(r, c); }
  }
}

initMinesweeper();

// Admin
async function loadAdmin() {
  if (!currentUser||currentUser.role!=='admin') return;
  const r = await fetch('/api/admin/users'), d = await r.json();
  const tbody = document.getElementById('admin-user-list');
  if (!d.users||!d.users.length) { tbody.innerHTML='<tr><td colspan="8" style="text-align:center;color:#555">暂无用户</td></tr>'; return; }
  tbody.innerHTML = d.users.map(u => {
    const isSelf = u.id === currentUser.id;
    const isAdmin = u.role === 'admin';
    const canEdit = !isAdmin || isSelf;
    return `<tr>
      <td>${u.id}</td>
      <td style="color:#888;font-size:.8rem">${u.uid}</td>
      <td>${escapeHtml(u.username)}${isSelf?' <span style="color:#555;font-size:.75rem">(你)</span>':''}</td>
      <td><select onchange="updateRole(${u.id},this.value)" ${!canEdit?'disabled':''}>
        ${['user','vip','svip','admin'].map(r => `<option value="${r}" ${u.role===r?'selected':''}>${r}</option>`).join('')}
      </select></td>
      <td>Lv.${u.level||1}</td>
      <td><input class="xp-input" type="number" value="${u.xp||0}" id="xp-${u.id}" min="0" ${!canEdit?'disabled':''}></td>
      <td>${u.banned ? '<span style="color:#e94560;font-weight:600">封禁</span>' : '<span style="color:#4caf50">正常</span>'}</td>
      <td style="display:flex;gap:4px;flex-wrap:wrap">
        ${canEdit ? `<button class="btn btn-primary btn-sm" onclick="saveXp(${u.id})">保存</button>` : ''}
        ${u.banned ? `<button class="btn btn-ghost btn-sm" onclick="unbanUser(${u.id})">解封</button>`
          : (isSelf ? '' : `<button class="btn btn-sm" style="background:#c0392b;color:#fff" onclick="banUser(${u.id})">封禁</button>`)}
      </td>
    </tr>`;
  }).join('');
}
async function updateRole(id, role) {
  await fetch(`/api/admin/users/${id}/role`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({role})});
}
async function saveXp(id) {
  const xp = parseInt(document.getElementById('xp-'+id).value);
  await fetch(`/api/admin/users/${id}/xp`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({xp})});
  loadAdmin();
}
async function banUser(id) {
  if (!confirm('确定封禁该用户？')) return;
  const r = await fetch(`/api/admin/users/${id}/ban`,{method:'POST',headers:{'Content-Type':'application/json'}});
  const d = await r.json();
  if (d.error) return alert(d.error);
  loadAdmin();
}
async function unbanUser(id) {
  await fetch(`/api/admin/users/${id}/unban`,{method:'POST',headers:{'Content-Type':'application/json'}});
  loadAdmin();
}
// Re-observe admin section for lazy load
const adminObserver = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting && currentUser && currentUser.role === 'admin') loadAdmin(); });
}, {threshold:0.3});
adminObserver.observe(document.getElementById('sec-admin'));

function escapeHtml(str) { const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
