<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时聊天室</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font: 15px/1.5 system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #1a1a2e; }
    #chat { width: 480px; max-width: 94vw; background: #16213e; border-radius: 12px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
    h1 { text-align: center; color: #e94560; margin-bottom: 16px; font-size: 1.3rem; }
    #messages { height: 340px; overflow-y: auto; padding: 12px; background: #0f3460; border-radius: 8px; margin-bottom: 12px; }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }
    .msg { padding: 6px 10px; margin: 4px 0; background: #1a1a40; border-radius: 6px; color: #eee; word-break: break-word; animation: fadeIn .2s; }
    .msg .time { font-size: .7rem; color: #888; margin-right: 6px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    #form { display: flex; gap: 8px; }
    #input { flex: 1; padding: 10px 14px; border: none; border-radius: 8px; font-size: .95rem; outline: none; background: #0f3460; color: #eee; }
    #input::placeholder { color: #666; }
    button { padding: 10px 20px; border: none; border-radius: 8px; background: #e94560; color: #fff; font-weight: 600; cursor: pointer; transition: background .2s; }
    button:hover { background: #c73650; }
  </style>
</head>
<body>
  <div id="chat">
    <h1>💬 实时聊天室</h1>
    <div id="messages"></div>
    <form id="form">
      <input id="input" placeholder="输入消息..." autocomplete="off" required />
      <button>发送</button>
    </form>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value.trim()) {
        socket.emit('chat message', input.value);
        input.value = '';
      }
    });

    socket.on('chat message', (msg) => {
      const el = document.createElement('div');
      el.className = 'msg';
      el.innerHTML = `<span class="time">${new Date().toLocaleTimeString()}</span>${escapeHtml(msg)}`;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
